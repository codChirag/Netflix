<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1 class="logo">NETFLIX</h1>
        <img src="https://i.pravatar.cc/40" class="avatar">
    </div>

    <!-- Banner -->
    <header class="banner">
        <div class="banner-content">
            <h1>Stranger Things</h1>
            <p>A thrilling sci-fi series with mystery and adventure.</p>
            <button class="btn">Play</button>
            <button class="btn">My List</button>
        </div>
    </header>

    <!-- Movie Rows -->
    <div class="row">
        <h2>Trending Now</h2>
        <div class="row-posters">
            <img src="https://via.placeholder.com/150" class="poster">
            <img src="https://via.placeholder.com/150" class="poster">
            <img src="https://via.placeholder.com/150" class="poster">
            <img src="https://via.placeholder.com/150" class="poster">
            <img src="https://via.placeholder.com/150" class="poster">
        </div>
    </div>

    <div class="row">
        <h2>Top Rated</h2>
        <div class="row-posters">
            <img src="https://via.placeholder.com/150" class="poster">
            <img src="https://via.placeholder.com/150" class="poster">
            <img src="https://via.placeholder.com/150" class="poster">
            <img src="https://via.placeholder.com/150" class="poster">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
